<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Better World Monitor: a lit globe on a night tile, an orbit, and one live signal. macOS grid: 824 tile at 100. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a" />
      <stop offset="1" stop-color="#070b16" />
    </linearGradient>
    <radialGradient id="globe" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#7fd6ff" />
      <stop offset="0.45" stop-color="#1e8bff" />
      <stop offset="1" stop-color="#0a2f73" />
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#3aa0ff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#3aa0ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.48" stop-color="#020617" stop-opacity="0" />
      <stop offset="0.78" stop-color="#020617" stop-opacity="0.55" />
    </linearGradient>
    <clipPath id="ball">
      <circle cx="512" cy="524" r="250" />
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" />
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" />

  <circle cx="512" cy="524" r="300" fill="url(#glow)" />
  <circle cx="512" cy="524" r="250" fill="url(#globe)" />

  <g clip-path="url(#ball)" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="5">
    <ellipse cx="512" cy="524" rx="250" ry="90" />
    <line x1="262" y1="524" x2="762" y2="524" />
    <ellipse cx="512" cy="524" rx="250" ry="185" stroke-opacity="0.16" />
    <ellipse cx="512" cy="524" rx="85" ry="250" />
    <ellipse cx="512" cy="524" rx="175" ry="250" stroke-opacity="0.18" />
    <line x1="512" y1="274" x2="512" y2="774" />
    <rect x="262" y="274" width="500" height="500" fill="url(#night)" stroke="none" />
  </g>
  <circle cx="512" cy="524" r="250" fill="none" stroke="#bfe6ff" stroke-opacity="0.35" stroke-width="4" />

  <!-- orbit, drawn behind the globe on the far side and in front on the near side -->
  <g fill="none" stroke="#ffd60a" stroke-width="7" stroke-linecap="round" transform="rotate(-24 512 524)">
    <path d="M 172 524 A 340 112 0 0 1 852 524" stroke-opacity="0.28" />
    <path d="M 852 524 A 340 112 0 0 1 172 524" stroke-opacity="0.95" />
  </g>
  <circle cx="234" cy="681" r="17" fill="#ffd60a" />

  <!-- the live signal -->
  <circle cx="592" cy="448" r="74" fill="none" stroke="#ff453a" stroke-opacity="0.35" stroke-width="8" />
  <circle cx="592" cy="448" r="48" fill="none" stroke="#ff453a" stroke-opacity="0.7" stroke-width="10" />
  <circle cx="592" cy="448" r="30" fill="#ff453a" filter="url(#soft)" opacity="0.85" />
  <circle cx="592" cy="448" r="24" fill="#ff6b5e" />
</svg>
